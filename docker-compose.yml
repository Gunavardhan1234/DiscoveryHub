services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: discoveryhub
      CASE_DB_PASSWORD: ${CASE_DB_PASSWORD}
      EXPORT_DB_PASSWORD: ${EXPORT_DB_PASSWORD}
      INGEST_DB_PASSWORD: ${INGEST_DB_PASSWORD}
      HOLD_DB_PASSWORD: ${HOLD_DB_PASSWORD}
    ports: ["5433:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 15

  mongo:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      ARCHIVE_MONGO_PASSWORD: ${ARCHIVE_MONGO_PASSWORD}
      AUDIT_MONGO_PASSWORD: ${AUDIT_MONGO_PASSWORD}
    ports: ["27017:27017"]
    volumes:
      - mongo_data:/data/db
      - ./infra/mongo/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.runCommand({ping:1}).ok' localhost:27017/admin | grep 1"]
      interval: 5s
      timeout: 10s
      retries: 15

  kafka:
    image: apache/kafka:3.9.0
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20

  elasticsearch:
    # Must match the co.elastic.clients:elasticsearch-java version managed by
    # Spring Boot 3.5.3 (8.18.1). A newer client against this older server fails
    # to decode the openPointInTime response (the 8.18 client requires the
    # `_shards` field that 8.15.x omits), which surfaces as 503 SEARCH_UNAVAILABLE
    # on POST /api/search/scope-ids ("Add all matching to case"). The search
    # integration tests already pin 8.18.1 for the same reason.
    image: docker.elastic.co/elasticsearch/elasticsearch:8.18.1
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports: ["9200:9200"]
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health >/dev/null"]
      interval: 10s
      timeout: 10s
      retries: 20

  localstack:
    # LocalStack S3 for attachment + export package storage. Buckets
    # (discoveryhub-attachments, discoveryhub-exports) are auto-created by
    # the ready-hook in infra/localstack/init/ready.d on first boot.
    image: localstack/localstack:3.8
    environment:
      SERVICES: s3
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
      AWS_DEFAULT_REGION: ${AWS_REGION:-us-east-1}
    ports: ["4566:4566"]
    volumes:
      - localstack_data:/var/lib/localstack
      - ./infra/localstack/init/ready.d:/etc/localstack/init/ready.d:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:4566/_localstack/health >/dev/null"]
      interval: 10s
      timeout: 10s
      retries: 20

  ingest-service:
    build: {context: ., dockerfile: services/ingest-service/Dockerfile, additional_contexts: {m2repo: "${HOME}/.m2/repository"}}
    ports: ["8081:8081"]
    environment:
      SPRING_PROFILES_ACTIVE: docker
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      INGEST_DB_URL: jdbc:postgresql://postgres:5432/discoveryhub_ingest

      INGEST_DB_USER: ${INGEST_DB_USER:-ingest_svc}
      INGEST_DB_PASSWORD: ${INGEST_DB_PASSWORD:-ingest_svc}
      # Defaults via :- so a missing .env key yields a usable value, not an
      # empty string (which would defeat Spring's own ${VAR:default} fallback).
      S3_ENDPOINT: ${S3_ENDPOINT:-http://localstack:4566}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      ATTACHMENT_BUCKET: ${ATTACHMENT_BUCKET:-discoveryhub-attachments}

    depends_on:
      kafka: {condition: service_healthy}
      postgres: {condition: service_healthy}
      localstack: {condition: service_healthy}
    healthcheck: &app-health
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 15

  archive-service:
    build: {context: ., dockerfile: services/archive-service/Dockerfile, additional_contexts: {m2repo: "${HOME}/.m2/repository"}}
    ports: ["8082:8082"]
    environment:
      SPRING_PROFILES_ACTIVE: docker
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MONGODB_URI: mongodb://archive_svc:${ARCHIVE_MONGO_PASSWORD}@mongo:27017/discoveryhub_archive?authSource=discoveryhub_archive
      S3_ENDPOINT: ${S3_ENDPOINT:-http://localstack:4566}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      ATTACHMENT_BUCKET: ${ATTACHMENT_BUCKET:-discoveryhub-attachments}
    depends_on:
      kafka: {condition: service_healthy}
      mongo: {condition: service_healthy}
      localstack: {condition: service_healthy}
    healthcheck:
      <<: *app-health
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/actuator/health | grep -q UP"]

  search-service:
    build: {context: ., dockerfile: services/search-service/Dockerfile, additional_contexts: {m2repo: "${HOME}/.m2/repository"}}
    ports: ["8083:8083"]
    environment:
      SPRING_PROFILES_ACTIVE: docker
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      ELASTICSEARCH_URI: http://elasticsearch:9200
    depends_on:
      kafka: {condition: service_healthy}
      elasticsearch: {condition: service_healthy}
    healthcheck:
      <<: *app-health
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/actuator/health | grep -q UP"]

  case-service:
    build: {context: ., dockerfile: services/case-service/Dockerfile, additional_contexts: {m2repo: "${HOME}/.m2/repository"}}
    ports: ["8084:8084"]
    environment:
      SPRING_PROFILES_ACTIVE: docker
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      CASE_DB_URL: jdbc:postgresql://postgres:5432/discoveryhub_case
      CASE_DB_USER: case_svc
      CASE_DB_PASSWORD: ${CASE_DB_PASSWORD}
      # No depends_on for hold-service: hold-service already depends_on
      # case-service (FR-2.5's closed-case check), so adding the reverse
      # edge here would be a circular dependency. RestHoldSummaryAdapter is
      # fail-open (returns 0) if hold-service isn't up yet, so no ordering
      # constraint is needed.
      HOLD_BASE_URL: http://hold-service:8087
    depends_on:
      kafka: {condition: service_healthy}
      postgres: {condition: service_healthy}
    healthcheck:
      <<: *app-health
      test: ["CMD-SHELL", "wget -qO- http://localhost:8084/actuator/health | grep -q UP"]

  hold-service:
    build: {context: ., dockerfile: services/hold-service/Dockerfile, additional_contexts: {m2repo: "${HOME}/.m2/repository"}}
    ports: ["8087:8087"]
    environment:
      SPRING_PROFILES_ACTIVE: docker
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      HOLD_DB_URL: jdbc:postgresql://postgres:5432/discoveryhub_hold
      HOLD_DB_USER: hold_svc
      HOLD_DB_PASSWORD: ${HOLD_DB_PASSWORD}
      CASE_BASE_URL: http://case-service:8084
      # FR-5.2 requires a *scheduled* disposition process, so the 120s sweep
      # ships enabled. It is safe because RetentionSeeder seeds EMAIL=P2555D /
      # CHAT=P1095D (7y/3y, FR-5.1) — comfortably past the generator's 30-day
      # back-dating window, so no seeded message is eligible and a tick deletes
      # nothing until something is genuinely expired. (This was previously
      # false: minute-level seeds made the entire corpus eligible on the first
      # tick.) The manual trigger POST /api/holds/disposition/run still works
      # for on-demand runs; set to false to stop the sweep entirely.
      DISPOSITION_SCHEDULED_ENABLED: ${DISPOSITION_SCHEDULED_ENABLED:-true}
    depends_on:
      kafka: {condition: service_healthy}
      postgres: {condition: service_healthy}
      case-service: {condition: service_healthy}
    healthcheck:
      <<: *app-health
      test: ["CMD-SHELL", "wget -qO- http://localhost:8087/actuator/health | grep -q UP"]

  export-service:
    build: {context: ., dockerfile: services/export-service/Dockerfile, additional_contexts: {m2repo: "${HOME}/.m2/repository"}}
    ports: ["8085:8085"]
    environment:
      SPRING_PROFILES_ACTIVE: docker
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      EXPORT_DB_URL: jdbc:postgresql://postgres:5432/discoveryhub_export
      EXPORT_DB_USER: export_svc
      EXPORT_DB_PASSWORD: ${EXPORT_DB_PASSWORD}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://localstack:4566}
      S3_PATH_STYLE_ACCESS: "true"
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:4566}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      EXPORT_ATTACHMENTS_BUCKET: ${EXPORT_ATTACHMENTS_BUCKET:-discoveryhub-attachments}
      EXPORT_EXPORTS_BUCKET: ${EXPORT_EXPORTS_BUCKET:-discoveryhub-exports}
      CASE_BASE_URL: http://case-service:8084
      ARCHIVE_BASE_URL: http://archive-service:8082
      SEARCH_BASE_URL: http://search-service:8083
      HOLD_BASE_URL: http://hold-service:8087
    depends_on:
      kafka: {condition: service_healthy}
      search-service: {condition: service_healthy}
      postgres: {condition: service_healthy}
      localstack: {condition: service_healthy}
      hold-service: {condition: service_healthy}
    healthcheck:
      <<: *app-health
      test: ["CMD-SHELL", "wget -qO- http://localhost:8085/actuator/health | grep -q UP"]

  audit-service:
    build: {context: ., dockerfile: services/audit-service/Dockerfile, additional_contexts: {m2repo: "${HOME}/.m2/repository"}}
    ports: ["8086:8086"]
    environment:
      SPRING_PROFILES_ACTIVE: docker
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MONGODB_URI: mongodb://audit_svc:${AUDIT_MONGO_PASSWORD}@mongo:27017/discoveryhub_audit?authSource=discoveryhub_audit
    depends_on:
      kafka: {condition: service_healthy}
      mongo: {condition: service_healthy}
    healthcheck:
      <<: *app-health
      test: ["CMD-SHELL", "wget -qO- http://localhost:8086/actuator/health | grep -q UP"]

  api-gateway:
    build: {context: ., dockerfile: services/api-gateway/Dockerfile, additional_contexts: {m2repo: "${HOME}/.m2/repository"}}
    ports: ["8080:8080"]
    environment:
      SPRING_PROFILES_ACTIVE: docker
      INGEST_URI: http://ingest-service:8081
      ARCHIVE_URI: http://archive-service:8082
      SEARCH_URI: http://search-service:8083
      CASE_URI: http://case-service:8084
      HOLD_URI: http://hold-service:8087
      EXPORT_URI: http://export-service:8085
      AUDIT_URI: http://audit-service:8086
    depends_on:
      ingest-service: {condition: service_healthy}
      archive-service: {condition: service_healthy}
      search-service: {condition: service_healthy}
      case-service: {condition: service_healthy}
      hold-service: {condition: service_healthy}
      export-service: {condition: service_healthy}
      audit-service: {condition: service_healthy}
    healthcheck:
      <<: *app-health
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]

  web:
    build: {context: web}
    ports: ["4200:80"]
    depends_on:
      api-gateway: {condition: service_healthy}
    healthcheck:
      # 127.0.0.1, not localhost: busybox wget prefers ::1 but nginx listens on IPv4 only
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 15

  generator:
    profiles: ["seed"]
    build: {context: ., dockerfile: tools/corpus-generator/Dockerfile, additional_contexts: {m2repo: "${HOME}/.m2/repository"}}
    command: ["--messages", "10000", "--custodians", "25", "--attachment-pct", "8"]
    environment:
      INGEST_URL: http://ingest-service:8081
    depends_on:
      ingest-service: {condition: service_healthy}

volumes:
  postgres_data:
  mongo_data:
  es_data:
  localstack_data:
