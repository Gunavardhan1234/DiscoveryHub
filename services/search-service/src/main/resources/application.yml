server.port: 8083
spring:
  application.name: search-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  jackson:
    serialization.write-dates-as-timestamps: false
management.endpoints.web.exposure.include: health,info

discoveryhub:
  search:
    index-name: ${SEARCH_INDEX_NAME:messages}
    index-mapping: classpath:es/messages-index.json
  kafka:
    # Own consumer group, independent of ingest/archive groups (architecture §4).
    search-group: ${SEARCH_CONSUMER_GROUP:search-indexer}
  dashboard:
    case-base-url: ${CASE_BASE_URL:http://localhost:8084}
    hold-base-url: ${HOLD_BASE_URL:http://localhost:8087}
    export-base-url: ${EXPORT_BASE_URL:http://localhost:8085}

---
spring.config.activate.on-profile: local
spring.elasticsearch.uris: ${ELASTICSEARCH_URI:http://localhost:9200}
spring.kafka.bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer:
  group-id: ${discoveryhub.kafka.search-group}
  key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
  value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
  auto-offset-reset: earliest
  enable-auto-commit: false
  properties:
    isolation.level: read_committed
spring.kafka.producer:
  key-serializer: org.apache.kafka.common.serialization.StringSerializer
  value-serializer: org.apache.kafka.common.serialization.StringSerializer
spring.kafka.listener.ack-mode: record

---
spring.config.activate.on-profile: docker
spring.elasticsearch.uris: ${ELASTICSEARCH_URI:http://elasticsearch:9200}
spring.kafka.bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
discoveryhub.dashboard:
  case-base-url: ${CASE_BASE_URL:http://case-service:8084}
  hold-base-url: ${HOLD_BASE_URL:http://hold-service:8087}
  export-base-url: ${EXPORT_BASE_URL:http://export-service:8085}
spring.kafka.consumer:
  group-id: ${discoveryhub.kafka.search-group}
  key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
  value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
  auto-offset-reset: earliest
  enable-auto-commit: false
  properties:
    isolation.level: read_committed
spring.kafka.producer:
  key-serializer: org.apache.kafka.common.serialization.StringSerializer
  value-serializer: org.apache.kafka.common.serialization.StringSerializer
spring.kafka.listener.ack-mode: record
